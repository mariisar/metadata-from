<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data Analysis and Technical Support | พอร์ทัลส่วนงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --green:#8B1A1A; --grad:linear-gradient(90deg,#8B1A1A 0%,#7B3636 45%,#666464 100%); --cream:#FFFFFF; --hl:#F6EAE8; --on-cream:#2A1C1C;
  --bg:#F2EFEE; --surface:#F8F6F5; --ink:#2A1C1C; --muted:#6B5F5F; --line:#D9D1CF; --soft:#E9E3E1; --tag:#8B1A1A;
  --serif:var(--sans);
  --sans:"Plus Jakarta Sans","Prompt","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --green:#6E1515; --grad:linear-gradient(90deg,#6E1515 0%,#522A2A 50%,#3F3C3C 100%); --hl:#3A2424; --bg:#1B1515; --surface:#251B1B; --ink:#F1E9E9; --muted:#B8A8A8; --line:#3D2F2F; --soft:#2D2121; --tag:#E8A0A0;
  }
}
:root[data-theme="dark"]{
  --green:#6E1515; --grad:linear-gradient(90deg,#6E1515 0%,#522A2A 50%,#3F3C3C 100%); --bg:#1B1515; --surface:#251B1B; --ink:#F1E9E9; --muted:#B8A8A8; --line:#3D2F2F; --soft:#2D2121; --tag:#E8A0A0;
}
html{font-size:clamp(15px,calc(10px + .4167vw),22px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4.5rem);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:1rem;font-synthesis:none;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
header :focus-visible,.hero :focus-visible,footer :focus-visible{outline-color:var(--cream)}
.en{color:var(--muted);font-weight:400}
.wrap{max-width:75rem;margin:0 auto;padding:0 2rem}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--grad);color:var(--cream)}
header .wrap{display:flex;align-items:center;gap:1.75rem;height:4.375rem}
.brand{display:block;flex:none;text-decoration:none}
.brand img{height:2.875rem;width:auto;display:block}
nav{display:flex;gap:2px;align-self:stretch;min-width:0;flex:1 1 auto}
nav>a,.dd-btn{display:flex;align-items:center;align-self:center;height:2.5rem;padding:0 1rem;text-decoration:none;font-size:0.875rem;white-space:nowrap;opacity:.9;border-radius:62.4375rem;transition:opacity .2s ease,background-color .2s ease}
nav>a:hover,.dd:hover .dd-btn,.dd:focus-within .dd-btn,.dd.open .dd-btn{opacity:1;background:rgba(255,255,255,.16)}
.dd{position:relative;display:flex;align-items:stretch}
.dd-btn::after{content:"";width:0.375rem;height:0.375rem;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin:-3px 0 0 0.5625rem;transition:transform .25s ease,margin .25s ease}
.dd:hover .dd-btn::after,.dd:focus-within .dd-btn::after,.dd.open .dd-btn::after{transform:rotate(-135deg);margin-top:0.25rem}
.dd-menu{position:absolute;top:calc(100% + 0.5rem);left:0;min-width:min(18.75rem,90vw);padding:0.5rem;background:var(--green);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:1.125rem;box-shadow:0 1.125rem 2rem -0.75rem rgba(30,10,10,.55);
  opacity:0;visibility:hidden;transform:translateY(-0.5rem);pointer-events:none;transition:opacity .22s ease,transform .22s ease,visibility 0s linear .22s}
.dd:hover .dd-menu,.dd:focus-within .dd-menu,.dd.open .dd-menu{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity .22s ease,transform .22s ease,visibility 0s}
.dd-menu::before{content:"";position:absolute;left:0;right:0;top:-0.625rem;height:0.625rem}
.dd.shut .dd-menu{opacity:0;visibility:hidden;transform:translateY(-0.5rem);pointer-events:none;transition:opacity .12s ease,transform .12s ease,visibility 0s linear .12s}
.dd-menu a{display:block;padding:0.6875rem 1rem;border-radius:0.75rem;font-size:0.875rem;text-decoration:none;color:#fff;opacity:0;transform:translateY(-0.25rem);box-shadow:inset 0 0 0 0 #fff;transition:opacity .25s ease,transform .25s ease,background-color .18s ease,box-shadow .18s ease,padding .18s ease}
.dd:hover .dd-menu a,.dd:focus-within .dd-menu a,.dd.open .dd-menu a{opacity:.92;transform:none}
.dd:hover .dd-menu a:nth-child(1),.dd:focus-within .dd-menu a:nth-child(1),.dd.open .dd-menu a:nth-child(1){transition-delay:.02s,.02s,0s,0s,0s}
.dd:hover .dd-menu a:nth-child(2),.dd:focus-within .dd-menu a:nth-child(2),.dd.open .dd-menu a:nth-child(2){transition-delay:.05s,.05s,0s,0s,0s}
.dd:hover .dd-menu a:nth-child(3),.dd:focus-within .dd-menu a:nth-child(3),.dd.open .dd-menu a:nth-child(3){transition-delay:.08s,.08s,0s,0s,0s}
.dd:hover .dd-menu a:nth-child(4),.dd:focus-within .dd-menu a:nth-child(4),.dd.open .dd-menu a:nth-child(4){transition-delay:.11s,.11s,0s,0s,0s}
.dd:hover .dd-menu a:nth-child(5),.dd:focus-within .dd-menu a:nth-child(5),.dd.open .dd-menu a:nth-child(5){transition-delay:.14s,.14s,0s,0s,0s}
.dd:hover .dd-menu a:nth-child(6),.dd:focus-within .dd-menu a:nth-child(6),.dd.open .dd-menu a:nth-child(6){transition-delay:.17s,.17s,0s,0s,0s}
.dd .dd-menu a:hover,.dd .dd-menu a:focus-visible{opacity:1;background:rgba(255,255,255,.16);padding-left:1.25rem}
.dd-menu a:focus-visible{outline:2px solid #fff;outline-offset:-2px}
@media(prefers-reduced-motion:reduce){.dd-menu,.dd-menu a,.dd-btn::after,.svc{transition:none!important}.svc:hover{transform:none}}
.hbtn{flex:none;margin-left:auto;white-space:nowrap;font-size:0.875rem;text-decoration:none;padding:0.625rem 1.5rem;border:1px solid rgba(255,255,255,.6);border-radius:62.4375rem}
.hbtn:hover{background:rgba(255,255,255,.12)}
@media(max-width:600px){header .wrap{gap:0.75rem;padding:0 1rem}.hbtn{padding:0.5rem 0.75rem}}

.hero{position:relative;overflow:hidden;background:var(--grad);color:var(--cream);min-height:min(88vh,50rem);display:flex;flex-direction:column;justify-content:flex-end}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 55% at 62% 0%,rgba(255,200,200,.18),transparent 70%)}
.dots{position:absolute;inset:0;pointer-events:none;
  background-image:
   radial-gradient(circle,rgba(255,236,236,.22) 0 1rem,rgba(255,236,236,.08) 1.0625rem,transparent 1.625rem),
   radial-gradient(circle,rgba(255,236,236,.2) 0 0.4375rem,transparent 0.6875rem),
   radial-gradient(circle,rgba(255,236,236,.5) 0 2px,transparent 3px),
   radial-gradient(circle,rgba(255,236,236,.32) 0 1.5px,transparent 2.5px);
  background-size:32.5rem 27.5rem,19.375rem 16.875rem,11.875rem 10.625rem,7.5rem 9.375rem;
  background-position:3.75rem 2.5rem,11.25rem 7.5rem,0 0,3.125rem 4.375rem;
  animation:drift 100s linear infinite}
@keyframes drift{to{background-position:3.75rem -25rem,11.25rem -9.375rem,0 -21.25rem,3.125rem -14.375rem}}
.hero .wrap{position:relative;width:100%;padding-top:8.75rem}
.badge{display:inline-block;font-size:0.8125rem;padding:3px 0.875rem;border:1px solid rgba(255,255,255,.5);border-radius:6.1875rem;margin-bottom:1.5rem}
.hero h1{font-family:var(--sans);font-weight:600;font-size:clamp(2.75rem,8.5vw,6.5rem);line-height:1.08;letter-spacing:-.025em;margin:0 0 2.75rem}
.row{border-top:1px solid rgba(255,255,255,.35);padding:1.75rem 0 2.75rem;display:flex;justify-content:space-between;align-items:flex-start;gap:2rem;flex-wrap:wrap}
.row p{margin:0;max-width:30em;font-size:1rem;line-height:1.65}
.row p b{display:block;font-weight:500;margin-bottom:0.25rem}
.btn{display:inline-block;padding:0.8125rem 1.625rem;background:var(--cream);color:var(--on-cream);text-decoration:none;font-weight:500;border-radius:0.25rem;white-space:nowrap}
.btn:hover{filter:brightness(.93)}
@media(prefers-reduced-motion:reduce){.dots{animation:none}html{scroll-behavior:auto}}

section{padding:4.5rem 0;border-top:1px solid var(--line)}
section.first{border-top:0}
h2{font-family:var(--sans);font-weight:600;font-size:clamp(1.875rem,4vw,2.625rem);margin:0 0 0.5rem;line-height:1.2;letter-spacing:-.015em}
h2 .en{font-family:var(--sans);font-size:.5em;margin-left:0.625rem}
.sub{color:var(--muted);margin:0 0 2.25rem}
#services h2{margin-bottom:2.25rem}
[hidden]{display:none!important}
.hero.short{min-height:0}
.hero.short .wrap{padding-top:4.5rem}
.hero.short h1{font-size:clamp(2.5rem,6vw,4.5rem);margin-bottom:2rem;font-weight:600}
.back{display:inline-block;margin-bottom:1.75rem;font-size:0.875rem;text-decoration:none;opacity:.9;border-bottom:1px solid rgba(255,255,255,.5)}
.back:hover{opacity:1;border-bottom-color:var(--cream)}

.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(18.75rem,1fr));gap:1.25rem}
.svc{display:block;text-decoration:none;border:1px solid var(--line);border-radius:1.375rem;padding:2.25rem 2rem 2rem;transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease}
.svc:hover{border-color:var(--ink);transform:translateY(-3px);box-shadow:0 0.875rem 1.75rem -1rem rgba(42,28,28,.35)}
.svc svg{width:4.25rem;height:4.25rem;stroke:var(--ink);fill:none;stroke-width:1.4;margin-bottom:1.75rem;display:block}
.svc h3{font-family:var(--sans);font-weight:600;font-size:1.5rem;margin:0 0 0.5rem;line-height:1.3}
.svc p{margin:0;color:var(--muted);font-size:0.875rem}

.split{display:grid;grid-template-columns:2fr 1fr;gap:3rem}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.chips{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem}
.chip{font:inherit;font-size:0.875rem;padding:0.375rem 1rem;border-radius:6.1875rem;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--green);color:var(--cream);border-color:var(--green)}
.news{list-style:none;margin:0;padding:0}
.news li{display:grid;grid-template-columns:6rem 1fr;gap:1rem;padding:1.125rem 0;border-bottom:1px solid var(--line)}
.news time{color:var(--muted);font-size:0.875rem}
.news b{display:block;font-weight:500;font-size:1.0625rem}
.tag{font-size:0.8125rem;color:var(--tag);font-weight:600}
aside .box{border:1px solid var(--line);border-radius:3px;padding:1.5rem}
aside h3{font-family:var(--sans);font-weight:600;margin:0 0 0.625rem;font-size:1.375rem}
aside ul{margin:0;padding-left:1.125rem;color:var(--muted);font-size:0.875rem}

.tools{margin-bottom:1rem}
input[type=search]{font:inherit;padding:0.625rem 0.875rem;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);min-width:min(21.25rem,100%)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:3px}
table{border-collapse:collapse;width:100%;min-width:48.75rem;font-size:0.9375rem}
th,td{text-align:left;padding:0.875rem 1.125rem;border-bottom:1px solid var(--line)}
th{font-weight:600;font-size:0.875rem;background:var(--soft)}
tr:last-child td{border-bottom:0}
.status{font-size:0.8125rem;padding:2px 0.75rem;border-radius:6.1875rem;background:var(--soft);border:1px solid var(--line)}
.note{font-size:0.8125rem;color:var(--muted);margin-top:0.75rem}
.agent-tools{display:flex;gap:0.75rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.agent-tools input[type=search]{flex:1 1 17.5rem;min-width:0}
select#unitFilter{font:inherit;padding:0.625rem 0.875rem;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);max-width:100%;flex:0 1 20rem}
.count{margin-left:auto;color:var(--muted);font-size:0.875rem}
.sort{font:inherit;font-weight:600;background:none;border:0;padding:0;cursor:pointer;color:inherit}
th[aria-sort="ascending"] .sort::after{content:" \25B2";font-size:0.625rem}
th[aria-sort="descending"] .sort::after{content:" \25BC";font-size:0.625rem}
.pager{display:flex;gap:0.375rem;flex-wrap:wrap;justify-content:center;margin-top:1.25rem}
.pager button{min-width:2.375rem;height:2.375rem;padding:0 0.625rem;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:0.25rem;cursor:pointer;font:inherit;font-size:0.875rem}
.pager button:hover:not(:disabled){border-color:var(--ink)}
.pager button[aria-current="page"]{background:var(--green);color:#fff;border-color:var(--green)}
.pager button:disabled{opacity:.4;cursor:default}
.pager .gap{align-self:center;color:var(--muted)}
td a{color:inherit}
.hero.short h1.long{font-size:clamp(1.75rem,4.4vw,3.5rem);line-height:1.2;max-width:22em}
.duties{list-style:none;margin:0;padding:0;max-width:52em}
.duty{display:flex;gap:1.125rem;align-items:flex-start;padding:1.25rem 0;border-bottom:1px solid var(--line);font-size:1.0625rem}
.duty .n{flex:none;width:2.375rem;height:2.375rem;border-radius:50%;background:var(--green);color:#fff;font-family:var(--sans);font-weight:600;font-size:1.125rem;display:flex;align-items:center;justify-content:center}
.soon{border:1px dashed var(--line);border-radius:1.375rem;padding:4rem 2rem;text-align:center;color:var(--muted);font-size:1.125rem}
/* ===== Our Services: minimal cards in a scrolling row ===== */
#services h2{margin:0 0 2rem}
.car-wrap{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.car-wrap>.track{flex:1}
#services{min-height:min(calc(100svh - 4.4rem),60rem);display:flex;flex-direction:column;justify-content:center}
#services>.wrap{width:100%;flex:1;display:flex;flex-direction:column}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:2.625rem;height:2.625rem;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:1.25rem;font-weight:500;line-height:1;padding:0 0 2px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0.375rem 1rem -0.5rem rgba(42,28,28,.35);transition:opacity .2s ease,border-color .2s ease,background-color .2s ease}
.car-btn.prev{left:-1.25rem}.car-btn.next{right:-1.25rem}
.car-btn:hover:not(:disabled){border-color:var(--ink);background:var(--bg)}
.car-btn:disabled{opacity:0;pointer-events:none}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 4.5rem)/4);grid-template-rows:auto 1fr auto;column-gap:1.5rem;row-gap:0;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0.375rem 0.625rem 1.75rem 0.375rem;margin:0 -0.625rem 0 -0.375rem;scroll-padding-left:0.375rem}
.track::-webkit-scrollbar{display:none}
.card{scroll-snap-align:start;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:1.375rem;padding:1.75rem 1.25rem 1.625rem;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease,background-color .25s ease}
@supports (grid-template-rows:subgrid){.card{display:grid;grid-template-rows:subgrid;grid-row:span 3}}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--ink);background:var(--hl);box-shadow:0 1rem 1.875rem -1.125rem rgba(42,28,28,.4)}
.card h3{font-family:var(--sans);font-weight:600;font-size:1.65rem;line-height:1.25;margin:0;text-align:center;align-self:center;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:0.25rem 0 0.25rem;letter-spacing:-.01em}
.card .ic{width:4rem;height:4rem;stroke:var(--ink);fill:none;stroke-width:1.4;margin:1rem auto 2rem;display:block;align-self:center;justify-self:center;transition:stroke .2s ease}
.card:hover .ic,.card:focus-visible .ic{stroke:var(--green)}
.go-wrap{margin-top:auto;padding-top:1rem;display:block;text-align:center}
.go{display:inline-flex;align-items:center;justify-content:center;gap:0.375rem;border:1px solid var(--line);border-radius:62.4375rem;padding:0.3125rem 0.875rem;font-weight:500;font-size:0.8125rem;color:var(--muted);transition:background-color .2s ease,color .2s ease,border-color .2s ease}
.go .arr{width:0.875rem;height:0.875rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease}
.card:hover .go,.card:focus-visible .go{background:var(--green);border-color:var(--green);color:#fff}
.card:hover .go .arr{transform:translateX(0.25rem)}
@media(max-width:1199px){.track{grid-auto-columns:calc((100% - 3rem)/3)}}
@media(max-width:819px){.track{grid-auto-columns:calc((100% - 1.5rem)/2)}}
@media(max-width:559px){.track{grid-auto-columns:86%}.car-btn{width:2.25rem;height:2.25rem;font-size:1.0625rem}.car-btn.prev{left:-0.375rem}.car-btn.next{right:-0.375rem}}
@media(prefers-reduced-motion:reduce){.card,.card .ic,.car-btn,.go,.go .arr{transition:none!important}.track{scroll-behavior:auto}.card:hover{transform:none}}
/* ===== accordion rows (label + plus) ===== */
.acc-list{border-top:0}
.acc{border-bottom:1px solid var(--line)}
.acc-h{width:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem;text-align:left;background:none;border:0;padding:1.2rem 0;font:inherit;font-size:1.1rem;font-weight:500;color:var(--ink);cursor:pointer;transition:color .2s ease}
.acc-h:hover{color:var(--green)}
a.acc-h{text-decoration:none}
.acc-go{flex:none;width:1.1rem;height:1.1rem;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease}
a.acc-h:hover .acc-go{transform:translateX(0.25rem)}
.acc-h:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}
.acc-i{position:relative;flex:none;width:0.95rem;height:0.95rem}
.acc-i::before,.acc-i::after{content:"";position:absolute;left:0;top:50%;width:100%;height:1.5px;background:currentColor;transform:translateY(-50%);transition:transform .28s ease}
.acc-i::after{transform:translateY(-50%) rotate(90deg)}
.acc.open .acc-i::after{transform:translateY(-50%) rotate(0deg)}
.acc-b{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .3s ease,visibility 0s linear .3s}
.acc.open .acc-b{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .3s ease,visibility 0s}
.acc-in{overflow:hidden;min-height:0}
.acc-in>*:first-child{margin-top:0.25rem}
.acc-in>*:last-child{margin-bottom:1.5rem}
.meta{display:grid;grid-template-columns:max-content 1fr;gap:0.5rem 2rem;margin:0.25rem 0 1.5rem;font-size:0.95rem}
.meta dt{color:var(--muted)}.meta dd{margin:0}
@media(prefers-reduced-motion:reduce){.acc-b,.acc-i::before,.acc-i::after,.acc-h{transition:none!important}}
/* ===== storytelling steps with layered plates ===== */
.story{margin:0.5rem 0 1rem}
.step{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center;gap:2.5rem}
.step .plate{margin:-1rem 0}
.step svg{display:block;width:100%;max-width:27rem;height:auto;margin:0 auto}
.step .kick{display:block;font-size:0.8rem;letter-spacing:.04em;color:var(--green);margin-bottom:0.35rem;font-weight:600}
.step h4{font-family:var(--sans);font-weight:600;font-size:1.45rem;line-height:1.3;margin:0 0 0.6rem}
.step p{margin:0;color:var(--muted);font-size:0.97rem;line-height:1.8;max-width:30rem}
.pe{fill:var(--line)}
.pt{fill:var(--surface);stroke:var(--line);stroke-width:1.5;stroke-linejoin:round}
.pg{stroke:var(--line);stroke-width:.8;opacity:.55}
.pd{fill:var(--line)}
.tl{fill:var(--line)}.tr{fill:var(--soft)}
.tt,.tg,.tk{stroke:var(--muted);stroke-width:1.1;stroke-linejoin:round}
.tt{fill:var(--bg)}.tg{fill:var(--soft)}.tk{fill:var(--green);stroke:var(--green)}
.cn{fill:none;stroke:var(--muted);stroke-width:1.1;opacity:.8}

.so-bar button{border:0;background:none;font-size:1.5rem;line-height:1;color:var(--muted);cursor:pointer}
.so-res{overflow:auto;padding:0.375rem}
.so-item{display:flex;justify-between:space-between;align-items:baseline;gap:1rem;width:100%;text-align:left;border:0;background:none;padding:0.6875rem 0.75rem;border-radius:0.75rem;font:inherit;font-size:0.9375rem;color:var(--ink);cursor:pointer}
.so-item:hover,.so-item:focus-visible{background:var(--soft);outline:none}
.so-t{min-width:0}
.so-t mark{background:rgba(139,26,26,.16);color:inherit;border-radius:0.1875rem;padding:0 0.0625rem}
.so-p{flex:none;font-size:0.75rem;color:var(--muted);border:1px solid var(--line);border-radius:62.4375rem;padding:0.0625rem 0.625rem}
.so-empty{padding:2rem 1rem;text-align:center;color:var(--muted);font-size:0.9375rem}
.so-foot{padding:0.5rem 1.125rem;border-top:1px solid var(--line);font-size:0.75rem;color:var(--muted)}
.flash{animation:flash 1.8s ease}
@keyframes flash{0%,60%{background:rgba(139,26,26,.18);box-shadow:0 0 0 0.375rem rgba(139,26,26,.18);border-radius:0.25rem}100%{background:transparent;box-shadow:0 0 0 0.375rem transparent}}
@media(max-width:36rem){.hbtn{padding:0.5rem 0.875rem}.hright{gap:0.25rem}header .wrap{gap:0.5rem}}
/* ===== Dashboard ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:1rem;margin-bottom:1.25rem}
.kpi,.dcard{border:1px solid var(--line);border-radius:1rem;background:var(--surface)}
.kpi{padding:1.25rem 1.5rem}
.kpi-n{font-size:2.5rem;font-weight:600;letter-spacing:-.025em;line-height:1.1}
.kpi-l{margin-top:0.375rem;font-size:0.875rem;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.dash-grid .dcard:first-child{grid-row:span 2}
.dcard{padding:1.5rem}
.dcard h3{margin:0 0 1.25rem;font-size:1rem;font-weight:600}
.bar-row{display:grid;grid-template-columns:minmax(0,11rem) 1fr 2rem;align-items:center;gap:0.75rem;margin-bottom:0.875rem;font-size:0.8125rem}
.bar-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t{display:block;height:0.625rem;background:var(--soft);border-radius:62.4375rem;overflow:hidden}
.bar-f{display:block;height:100%;background:var(--green);border-radius:62.4375rem}
.bar-v{text-align:right;color:var(--muted)}
#dashLine svg{display:block;width:100%;height:auto}
.dl-g{stroke:var(--line);stroke-width:1}
.dl-t{font-size:11px;fill:var(--muted)}
.dl-a{fill:var(--green);opacity:.12}
.dl-l{fill:none;stroke:var(--green);stroke-width:2;stroke-linejoin:round}
.dl-d{fill:var(--surface);stroke:var(--green);stroke-width:2}
.donut{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.donut svg{width:9rem;height:9rem;flex:none}
.dn-n{font-size:28px;font-weight:600;fill:var(--ink)}
.legend{list-style:none;margin:0;padding:0;font-size:0.875rem}
.legend li{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem}
.legend i{width:0.75rem;height:0.75rem;border-radius:50%;flex:none}
.legend b{font-weight:600;margin-left:0.25rem}
@media(max-width:52rem){.dash-grid{grid-template-columns:1fr}.dash-grid .dcard:first-child{grid-row:auto}}
/* ===== Our Services: larger icons ===== */
.card .ic{width:6.5rem;height:6.5rem;stroke-width:1.05;margin:1.25rem auto 2rem}

/* ===== typography reset & hierarchy ===== */
h1,h2,h3,h4{font-family:var(--sans);font-weight:600}
.hero h1,.hero.short h1{font-weight:600;letter-spacing:-.025em}
h2,.story2 h4,.card h3,.step h4,.svc h3,aside h3,.foot b{font-weight:600}
.brand,.foot b{font-family:var(--sans)}
.acc-h,.so-bar input,.help-q{font-family:var(--sans)}
</style>
</head>
