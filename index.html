<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metadata Management System</title>
<!-- Google Fonts Sarabun -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com/3.4.17"></script>

<style>
:root{--navy:#1E3A8A;--blue:#2563EB;--ink:#172b4d;--muted:#64748b;--line:#e7edf5}
*{box-sizing:border-box}
body{font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 100% 0%,#e7f0ff 0,transparent 32%),#F8FAFC;font-size:16px;line-height:1.6}
h1,h2{color:var(--navy);font-weight:700}
.kicker{color:var(--blue);font-size:12px;letter-spacing:.12rem;font-weight:600}
.sub{color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field-label{font-weight:600;color:#243b63;line-height:1.45}
.req{color:#b42336}
.field-control{width:100%;min-height:46px;border:1px solid #cbd7e6;border-radius:11px;background:#fff;padding:10px 13px;color:var(--ink);outline:none;transition:border-color .18s,box-shadow .18s}
.field-control:focus,.radio-choice:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.16)}
.field-control[aria-invalid="true"]{border-color:#bd3046}
.field-control::placeholder{color:#94a3b8}
.field-control:focus::placeholder{color:transparent}
select.field-control{color:FieldText}
select.field-control.select-placeholder{color:#94a3b8}
select.field-control option{color:FieldText;background:Field}
textarea.field-control{min-height:112px;resize:vertical}
.field-help{font-size:13px;color:var(--muted)}
.field-error{font-size:13px;font-weight:600;color:#b42336}
.field-error:empty{display:none}
.radio-choice{display:flex;align-items:center;gap:9px;min-height:44px;padding:9px 12px;border:1px solid #cbd7e6;border-radius:10px;cursor:pointer;background:#fff}
.radio-choice input{accent-color:var(--blue);width:17px;height:17px}
.radio-choice:has(input:checked){border-color:var(--blue);background:#eff6ff}
.email-group{display:flex;align-items:stretch;border:1px solid #cbd7e6;border-radius:11px;background:#fff;overflow:hidden;transition:border-color .18s,box-shadow .18s}
.email-group:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.16)}
.email-group[data-invalid="true"]{border-color:#bd3046}
.email-group input{flex:1;min-width:0;border:0;background:transparent;padding:10px 13px;min-height:44px;outline:none;color:var(--ink)}
.email-group input::placeholder{color:#94a3b8}
.email-group input:focus::placeholder{color:transparent}
.email-group .suffix{display:flex;align-items:center;justify-content:center;min-width:170px;padding:0 24px;font-size:16px;font-weight:400;background:#f1f5f9;border-left:1px solid #cbd7e6;color:#475569;white-space:nowrap}
.multi>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;user-select:none}
.multi>summary::-webkit-details-marker{display:none}
.multi>summary::after{content:'▾';color:#64748b;flex-shrink:0}
.multi[open]>summary{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.16)}
.multi>summary span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.multi>summary.is-placeholder{color:#94a3b8}
.multi-panel{margin-top:6px;border:1px solid #cbd7e6;border-radius:11px;background:#fff;max-height:300px;overflow-y:auto;padding:6px}
.multi-panel label{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;cursor:pointer}
.multi-panel label:hover{background:#eff6ff}
.multi-panel input{accent-color:var(--blue);width:17px;height:17px;margin-top:4px;flex-shrink:0}
.num{width:36px;height:36px;border-radius:8px;background:#eff6ff;color:var(--blue);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec{padding:32px 0;border-bottom:1px solid var(--line)}
.sec:last-of-type{border-bottom:0}
:focus-visible{outline:3px solid #60a5fa;outline-offset:3px}
.field-control:focus-visible{outline:none}
[hidden]{display:none!important}
.modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(12,31,65,.62);display:flex;align-items:center;justify-content:center;padding:20px}
.btn{background:var(--blue);color:#fff;font-weight:700;border-radius:12px;min-height:48px;padding:0 24px;box-shadow:0 6px 16px rgba(37,99,235,.22);cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.7;cursor:wait}
</style>
</head>
<body>
<header class="border-b border-blue-100 bg-white/80">
 <div class="max-w-5xl mx-auto px-5 sm:px-8 py-5 flex items-center gap-4">
  <div aria-hidden="true" class="w-11 h-11 rounded-xl bg-[#1E3A8A] text-white flex items-center justify-center shadow-sm">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-6 h-6"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/></svg>
  </div>
  <div>
   <p class="kicker">INTERNAL DATA PLATFORM</p>
   <p class="font-semibold" style="color:var(--navy)">Metadata Governance Portal</p>
  </div>
 </div>
</header>

<main class="max-w-5xl mx-auto px-4 sm:px-8 py-10 sm:py-14">
 <div class="mb-8">
  <span class="inline-block rounded-full px-3 py-1 mb-4 text-xs font-semibold" style="background:#dbeafe;color:var(--navy)">DATA GOVERNANCE / ลงทะเบียนข้อมูล</span>
  <h1 class="text-[32px] leading-tight max-w-3xl">Metadata Management System</h1>
  <p class="mt-3 text-lg" style="color:#475569">ระบบลงทะเบียน ค้นหา และกำกับดูแลชุดข้อมูลองค์กร</p>
 </div>

 <form id="metadata-form" novalidate>
  <div class="px-5 sm:px-9 py-6 border-b flex flex-wrap items-center justify-between gap-3" style="border-color:var(--line)">
   <div>
    <h2 class="text-2xl">ลงทะเบียน Metadata ชุดข้อมูล</h2>
    <p class="sub mt-1">กรอกข้อมูลที่เกี่ยวข้องเพื่อส่งชุดข้อมูลเข้าสู่กระบวนการตรวจสอบ</p>
   </div>
   <span class="px-3 py-1.5 rounded-full text-xs font-semibold" style="background:#fef2f2;color:#9f283c">* ข้อมูลที่จำเป็น</span>
  </div>

  <div class="px-5 sm:px-9">
   <!-- PAGE 1 -->
   <div id="page-1">
   <section class="sec" aria-labelledby="h1s">
    <div class="flex items-start gap-3 mb-6"><span class="num" aria-hidden="true">01</span>
